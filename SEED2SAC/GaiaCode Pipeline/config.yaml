# ============================================================================
# GaiaCode OmegaBox -> SAC pipeline configuration
# ============================================================================
# One entry per OmegaBox unit. The daemon mirrors each unit's /data/
# directory with wget, then converts every mirrored miniSEED file to SAC
# with station metadata injected from the unit's StationXML.
#
# NOTE: the OmegaBox does NOT serve StationXML metadata. Keep one XML file
# per station on this host (convention: <net>.<sta>.<loc>.xml, e.g.
# XX.ST01.00.xml) and point stationxml_path at it.

archive_paths:
  # Local mirror of the remote OmegaBox file trees (wget -P target).
  # Recommended: a dedicated data volume — see README ("Where the data lives").
  sds_root: /data/seismic/omegabox_mirror
  # Converted SAC output tree (one subdirectory per station).
  sac_root: /data/seismic/sac_archive

  # Fallback for small single-disk deployments:
  # sds_root: data/seismic/omegabox_mirror
  # sac_root: data/seismic/sac_archive

# Optional pipeline behaviour
settings:
  wget_timeout_s: 300        # per-station mirror timeout (seconds)
  log_file: pipeline.log     # relative to the pipeline directory
  mseed_extensions: [".mseed", ".miniseed", ".seed"]

stations:
  # NOTE: 'name' is the UNIT label (mirror dir); the StationXML must
  # describe the SEED station codes the unit actually archives — these can
  # be discovered by scanning the mirrored data.
  - name: ST01
    web_url: http://<INTERNAL_IP>/data/
    stationxml_path: metadata/XX.ST01.00.xml

  - name: ST02
    web_url: http://<INTERNAL_IP>/data/
    stationxml_path: metadata/XX.ST02.00.xml

  - name: ST03
    web_url: http://<INTERNAL_IP>/data/
    stationxml_path: metadata/XX.ST03.00.xml
